<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser — ARISH</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/browser.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='9' fill='%230f6cbd'/></svg>">
</head>
<body class="browser-page">

<div class="titlebar">
  <span>Browser</span>
  <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</div>

<main class="bapp">
  <section class="bcol bcol-plan">
    <p class="eyebrow">Step one</p>
    <h2>Commit a plan</h2>
    <p class="bsub">Sealed before a single page is read. Nothing on any page can widen it.</p>
    <div id="plan-form"></div>
  </section>

  <section class="bcol bcol-page">
    <div class="btabs" id="btabs"></div>
    <div id="main-pane"></div>
  </section>

  <section class="bcol bcol-log">
    <p class="eyebrow">Transcript</p>
    <h2>Every step, in order</h2>
    <p class="bsub">Actions and refusals, as the session recorded them.</p>
    <div id="log-pane"></div>
  </section>
</main>

<nav class="chrome">
  <div class="chrome-group">
    <a class="iconbtn" href="/" title="Get Started" aria-label="Get Started">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
    </a>
    <button class="iconbtn on" id="nav-browser" title="Browser" aria-label="Browser">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
    </button>
  </div>
  <div class="steps" id="hud"></div>
  <div class="chrome-group">
    <button class="iconbtn" id="reset" title="Start over" aria-label="Start over">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/></svg>
    </button>
  </div>
</nav>

<script src="/browser.js"></script>
</body>
</html>
