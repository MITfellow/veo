<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Started — ARISH</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='9' fill='%230f6cbd'/></svg>">
</head>
<body>

<div class="titlebar">
  <span>Get Started</span>
  <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</div>

<main class="app">
  <section class="pane-left">
    <p class="eyebrow" id="eyebrow">ARISH</p>
    <h1 id="heading">Loading…</h1>
    <p class="lede" id="lede"></p>
    <div id="left-extra"></div>
  </section>

  <section class="pane-right" id="pane-right"></section>
</main>

<nav class="chrome">
  <div class="chrome-group">
    <button class="iconbtn" id="nav-home" title="Overview" aria-label="Overview">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
    </button>
    <button class="iconbtn" id="nav-connect" title="Connectors" aria-label="Connectors">
      <svg viewBox="0 0 24 24"><path d="M9 7H6a4 4 0 0 0 0 8h3M15 7h3a4 4 0 0 1 0 8h-3M8 11h8"/></svg>
    </button>
    <button class="iconbtn" id="nav-model" title="Model" aria-label="Model">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
    </button>
  </div>

  <div class="steps" id="steps"></div>

  <div class="chrome-group">
    <button class="iconbtn" id="prev" title="Back" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="iconbtn" id="next" title="Next" aria-label="Next">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</nav>

<script src="/app.js"></script>
</body>
</html>
